<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>星芽营地｜即梦概念图清晰画廊</title>
  <style>
    :root { --ink:#26384A; --paper:#EEF1EC; --white:#FFF; --yellow:#FFD45A; --cyan:#43C6C8; --coral:#F36F62; --stone:#5E6670; }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--paper); color:var(--ink); font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif; letter-spacing:0; }
    header { background:var(--ink); color:white; padding:34px max(24px,calc((100vw - 1180px)/2)); border-bottom:7px solid var(--yellow); }
    h1 { margin:0 0 8px; font-size:36px; }
    header p { margin:0; color:#DDE5E4; line-height:1.6; }
    main { max-width:820px; margin:0 auto; padding:28px 24px 56px; }
    .summary { display:grid; grid-template-columns:repeat(3,1fr); gap:1px; background:#CBD3CF; border:1px solid #CBD3CF; margin-bottom:28px; }
    .summary div { background:white; padding:16px; }
    .summary strong { display:block; color:var(--coral); font-size:25px; }
    h2 { margin:34px 0 14px; font-size:23px; }
    .grid { display:grid; grid-template-columns:1fr; gap:18px; }
    figure { width:100%; max-width:760px; margin:0 auto; background:var(--white); border:1px solid #D7DDDA; border-radius:6px; overflow:hidden; }
    figure a { display:block; background:#DDE5E4; }
    img { display:block; width:100%; max-width:720px; height:auto; margin:0 auto; object-fit:contain; background:#DDE5E4; }
    figcaption { padding:11px 13px 13px; font-weight:700; }
    .single { max-width:760px; margin-top:18px; }
    .note { margin-top:28px; padding:16px 18px; border-left:5px solid var(--cyan); background:white; color:var(--stone); line-height:1.65; }
    @media (max-width:720px) { .summary { grid-template-columns:1fr; } h1 { font-size:30px; } }
  </style>
</head>
<body>
  <header>
    <h1>星芽营地：即梦概念图清晰版</h1>
    <p>Seedream 5.0 Pro 生成结果，共 23 张。已换用 720×405 清晰资源，保持完整 16:9 构图；点击图片可单独查看原图。</p>
  </header>
  <main>
    <section class="summary">
      <div><strong>1</strong>名主角</div>
      <div><strong>10</strong>只原创宠物</div>
      <div><strong>7</strong>个生态场景</div>
    </section>

    <h2>世界观主视觉</h2>
    <section class="grid">
      <figure><img src="即梦概念图_清晰版/01_世界观主视觉_A.webp" alt="世界观主视觉A"><figcaption>世界观主视觉 A</figcaption></figure>
      <figure><img src="即梦概念图_清晰版/01_世界观主视觉_B.webp" alt="世界观主视觉B"><figcaption>世界观主视觉 B</figcaption></figure>
    </section>

    <h2>主角澄夏</h2>
    <section class="grid">
      <figure><img src="即梦概念图_清晰版/02_主角澄夏设定页_A.webp" alt="主角澄夏设定页A"><figcaption>澄夏设定页 A</figcaption></figure>
      <figure><img src="即梦概念图_清晰版/02_主角澄夏设定页_B.webp" alt="主角澄夏设定页B"><figcaption>澄夏设定页 B</figcaption></figure>
    </section>

    <h2>十只宠物</h2>
    <section class="grid">
      <figure><img src="即梦概念图_清晰版/03_雾团啾_炉尾狸_A.webp" alt="雾团啾与炉尾狸A"><figcaption>雾团啾 × 炉尾狸 A</figcaption></figure>
      <figure><img src="即梦概念图_清晰版/03_雾团啾_炉尾狸_B.webp" alt="雾团啾与炉尾狸B"><figcaption>雾团啾 × 炉尾狸 B</figcaption></figure>
      <figure><img src="即梦概念图_清晰版/04_苔甲墩_溪泡獭_A.webp" alt="苔甲墩与溪泡獭A"><figcaption>苔甲墩 × 溪泡獭 A</figcaption></figure>
      <figure><img src="即梦概念图_清晰版/04_苔甲墩_溪泡獭_B.webp" alt="苔甲墩与溪泡獭B"><figcaption>苔甲墩 × 溪泡獭 B</figcaption></figure>
      <figure><img src="即梦概念图_清晰版/05_闪芽鹿_夜墨蝠_A.webp" alt="闪芽鹿与夜墨蝠A"><figcaption>闪芽鹿 × 夜墨蝠 A</figcaption></figure>
      <figure><img src="即梦概念图_清晰版/05_闪芽鹿_夜墨蝠_B.webp" alt="闪芽鹿与夜墨蝠B"><figcaption>闪芽鹿 × 夜墨蝠 B</figcaption></figure>
      <figure><img src="即梦概念图_清晰版/06_铃风狐_晶钳蟹_A.webp" alt="铃风狐与晶钳蟹A"><figcaption>铃风狐 × 晶钳蟹 A</figcaption></figure>
      <figure><img src="即梦概念图_清晰版/06_铃风狐_晶钳蟹_B.webp" alt="铃风狐与晶钳蟹B"><figcaption>铃风狐 × 晶钳蟹 B</figcaption></figure>
      <figure><img src="即梦概念图_清晰版/07_菇灯羊_砂钟蜥_A.webp" alt="菇灯羊与砂钟蜥A"><figcaption>菇灯羊 × 砂钟蜥 A</figcaption></figure>
      <figure><img src="即梦概念图_清晰版/07_菇灯羊_砂钟蜥_B.webp" alt="菇灯羊与砂钟蜥B"><figcaption>菇灯羊 × 砂钟蜥 B</figcaption></figure>
    </section>

    <h2>捕捉装置</h2>
    <section class="grid">
      <figure><img src="即梦概念图_清晰版/08_芽核球设定_A.webp" alt="芽核球设定A"><figcaption>芽核球结构与状态 A</figcaption></figure>
      <figure><img src="即梦概念图_清晰版/08_芽核球设定_B.webp" alt="芽核球设定B"><figcaption>芽核球结构与状态 B</figcaption></figure>
    </section>

    <h2>场景</h2>
    <section class="grid">
      <figure><img src="即梦概念图_清晰版/09_树屋营地_露滴草原_A.webp" alt="树屋营地与露滴草原A"><figcaption>树屋营地 × 露滴草原 A</figcaption></figure>
      <figure><img src="即梦概念图_清晰版/09_树屋营地_露滴草原_B.webp" alt="树屋营地与露滴草原B"><figcaption>树屋营地 × 露滴草原 B</figcaption></figure>
      <figure><img src="即梦概念图_清晰版/10_萤苔森林_赤砂峡谷_A.webp" alt="萤苔森林与赤砂峡谷A"><figcaption>萤苔森林 × 赤砂峡谷 A</figcaption></figure>
      <figure><img src="即梦概念图_清晰版/10_萤苔森林_赤砂峡谷_B.webp" alt="萤苔森林与赤砂峡谷B"><figcaption>萤苔森林 × 赤砂峡谷 B</figcaption></figure>
      <figure><img src="即梦概念图_清晰版/11_星落海岸_冰镜洞窟_A.webp" alt="星落海岸与冰镜洞窟A"><figcaption>星落海岸 × 冰镜洞窟 A</figcaption></figure>
      <figure><img src="即梦概念图_清晰版/11_星落海岸_冰镜洞窟_B.webp" alt="星落海岸与冰镜洞窟B"><figcaption>星落海岸 × 冰镜洞窟 B</figcaption></figure>
    </section>
    <figure class="single"><img src="即梦概念图_清晰版/12_黯潮观测站_A.webp" alt="黯潮观测站"><figcaption>黯潮观测站</figcaption></figure>

    <p class="note">工具、消耗品与营地设施道具板在提交时遇到即梦额度耗尽，未计入本画廊。完整道具规格和可再次生成的提示词已保留在设计包中。</p>
  </main>
  <script>
    document.querySelectorAll("figure img").forEach((image) => {
      const link = document.createElement("a");
      link.href = image.src;
      link.target = "_blank";
      link.rel = "noopener";
      link.title = "查看清晰原图";
      image.parentNode.insertBefore(link, image);
      link.appendChild(image);
    });
  </script>
</body>
</html>
